# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar package in this folder.
version: "v0.4"

project:
  name: "Kourovka problem 20.52, a partial answer: |G| - k(G) = 16m for groups of odd order"
  description: >-
    A partial answer to problem 20.52 of the Kourovka Notebook (D. MacHale). For a
    finite group G of odd order, |G| - k(G) is a multiple of 16, where k(G) is the
    number of conjugacy classes (Burnside). The problem asks whether every multiple
    16m, m > 0, is attained by a non-abelian group of odd order. This formalization
    proves that it is attained for every odd m and for every m in which 2 occurs to
    an odd power (m = 2, 6, 8, 10, 14, 18, ...). The groups are
    (Z/n : Z/3) x Z/a, with Z/3 acting on Z/n by an element u with u^2 + u + 1 = 0,
    taken with n = 7 and with n = 12 y^2 + 1 for y a power of two. Nothing is proved
    for m in which 2 occurs to an even power at least 2 (m = 4, 12, 16, 20, ...), so
    the problem itself stays open.
  authors:
    - "Marcos Martín Salvador"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Marcos Martín Salvador"

classification:
  arxiv: ["math.GR"]
  msc2020: ["20D60", "20E45"]

sources:
  - title: >-
      An infinite family of odd-order groups attaining |G| - k(G) = 16m for every m
      that is odd or in which 2 occurs to an odd power
    type: original-proof
    relationship: other
    note: >-
      As far as the searches described in the README of this folder could tell, this
      result was first presented by the author, in the repository
      marcosmartinsalvador/conjecture-proofs (folder
      conjectures/kourovka_20_52_class_deficiency). The cases in which 2 occurs at most
      8 times in m, so in particular every m below 512, were already known (Buckley and
      MacHale, below).
  - title: "Unsolved Problems in Group Theory. The Kourovka Notebook, No. 21"
    contributors:
      - name: "E. I. Khukhro"
        role: "editor"
      - name: "V. D. Mazurov"
        role: "editor"
      - name: "D. MacHale"
        role: "problem-proposer"
    id: "arXiv:1401.0300v50"
    type: book
    location: "Problem 20.52"
    relationship: other
    note: >-
      States the open problem that this result partly answers. The result here is
      not a solution of the problem.
    author_endorsement: "not-contacted"
  - title: "Conjugate deficiency in finite groups"
    authors:
      - "S. M. Buckley"
      - "D. MacHale"
    id: "Irish Math. Soc. Bulletin 71 (2013), 13-19"
    type: paper
    location: "Problem 5 and the paragraph after it"
    relationship: other
    note: >-
      Earlier partial results on the same question. The paper asks the question,
      reduces it to powers of two by direct products with abelian groups, and gives
      one group for each of 2^4, ..., 2^12 (nine single examples), which settles
      every m in which 2 occurs at most 8 times. Four of its nine groups belong to
      the family used here; the paper says it sees no clear enough pattern. It was
      read in full. The proof here does not use it.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    One theorem, `result : Claim`. It covers m > 0 that is odd or has an odd
    exponent of 2. It says nothing about the other m. The proof is complete: no
    sorry, no axioms beyond the three standard ones, no native_decide.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: ["Claude Fable 5.2"]
      framework: "Claude Code"
      tool_setup: >-
        AI agent sessions in Claude Code with Lean 4.36.0 and Mathlib v4.36.0. One
        session chose the target, wrote the Lean statement and wrote the proof. A
        separate session, which did not write the proof, compared the statement with
        the source and searched for earlier solutions. A fixed checker script, which
        the sessions could not change, decided whether the proof was accepted.
      cost:
        wall_time: "not tracked for this result; found and checked on 27 November 2026"
        spend_usd: "not tracked"
        hardware: "cloud machines, 4 cores, 15 GB of memory"
      prompting_notes: >-
        The sessions were given written rules for what counts as a result (an exact
        statement, a machine-checked proof, an independent review) and were left to
        choose targets and methods.
  spend_usd: "not tracked"
  notes: >-
    The proof was generated by Claude Fable 5.2, an AI model made by Anthropic. The
    author did not find or write it. The author set up the project and its rules,
    read the reports and decided what to publish. The README of
    marcosmartinsalvador/conjecture-proofs says which proofs the author has studied
    closely; this one is not among them yet.

fidelity:
  divergences: >-
    The theorem is deliberately narrower than the problem: the problem asks about
    every m > 0, the theorem covers only m that is odd or in which 2 occurs to an odd
    power. Reading choices: "finite, of odd order" is `Finite G` and
    `Odd (Nat.card G)`; "non-abelian" is that two elements do not commute; k(G) is
    `Nat.card (ConjClasses G)`; the equation is written with addition,
    |G| = k(G) + 16 m, which is the same because k(G) is at most |G|; the group lives
    in `Type` (the lowest universe), which loses nothing for an existence statement.

review:
  status: "agent-reviewed"
  reviewers:
    - "A separate AI agent session (Claude Code) that did not write the proof"
  notes: >-
    No mathematician has reviewed this result. The reviewing session compared the
    Lean statement with the text of problem 20.52 in arXiv:1401.0300v50, proved small
    sanity facts about the definitions in Lean, rebuilt the groups with its own
    brute-force program for all 250 covered values of m up to 300 and for
    m = 512, 1536, 2048 and 8192, and searched for earlier work. That search found
    the 2013 paper of Buckley and MacHale, which the first working note had missed.

alignment:
  namespace: ""
  statements:
    - source: "Kourovka Notebook No. 21, problem 20.52"
      lean: "result"
      module: "Challenge"
      status: "partial: proved for m odd or with an odd exponent of 2; the other m are open"
      note: >-
        `Attained m` is the property asked for in the problem for one value of m.
        `Claim` restricts m; see fidelity.divergences.

acknowledgements: "Mathlib, in particular its count of commuting pairs by conjugacy classes."
