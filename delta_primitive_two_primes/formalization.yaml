# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar package in this folder.
version: "v0.4"

project:
  name: "24 and 40 are the only Δ-primitive numbers with exactly two prime factors"
  description: >-
    A proof of a conjecture of V. N. Schvöllner on the Δ property of natural
    numbers. For n >= 1 let D*_n be the set of differences |a - b| of complementary
    divisors, a b = n. The number n has the Δ property when some element of D*_n is
    the sum of two nonzero elements of D*_n, and it is Δ-primitive when it has the
    property and is not of the form α^2 m with α, m >= 2 and m having the property.
    The theorem: if n = p^x q^y with p, q distinct primes and x, y >= 1 is
    Δ-primitive, then n is 24 or 40. The source proves the case y = 1.
  authors:
    - "Marcos Martín Salvador"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Marcos Martín Salvador"

classification:
  arxiv: ["math.NT", "math.CO"]
  msc2020: ["11A05", "11D61"]

sources:
  - title: >-
      Proof that 24 and 40 are the only Δ-primitive numbers of the form p^x q^y
    type: original-proof
    relationship: other
    note: >-
      As far as the searches described in the README of this folder could tell, this
      result was first presented by the author, in the repository
      marcosmartinsalvador/conjecture-proofs (folder
      conjectures/delta_primitive_two_primes). The statement is the conjecture of the
      paper below; the proof is new.
  - title: "The Δ property: a bridge between split graphs and Number Theory"
    authors:
      - "Victor N. Schvöllner"
    id: "arXiv:2605.25264v1"
    type: paper
    location: "The conjecture at the end of the subsection \"Integers of the form p^k q\""
    relationship: other
    note: >-
      States the conjecture that is proved here, and proves its case y = 1. The
      definitions in Challenge.lean follow this paper.
    author_endorsement: "not-contacted"
  - title: "2-switch-degree classification of split graphs"
    authors:
      - "Victor Nicolas Schvöllner"
    id: "arXiv:2507.13479v2"
    type: other
    relationship: background
    note: >-
      The author's PhD thesis (2025), where the conjecture first appears, in a
      slightly wider wording that also allows the exponents x and y to be 0.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    One theorem, `result : Claim`: the conjecture as worded in the 2026 paper, for
    all primes p, q and all exponents x, y >= 1. The proof is complete: no sorry, no
    axioms beyond the three standard ones, no native_decide. Numbers with three or
    more prime factors are not treated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: ["Claude Fable 5.2"]
      framework: "Claude Code"
      tool_setup: >-
        AI agent sessions in Claude Code with Lean 4.36.0 and Mathlib v4.36.0. One
        session wrote the Lean statement and a proof on paper, a second wrote the
        Lean proof. A separate session, which wrote neither, compared
        the statement with the source and searched for earlier solutions. A fixed
        checker script, which the sessions could not change, decided whether the proof
        was accepted.
      cost:
        wall_time: "not tracked for this result; found and checked on 26 November 2026"
        spend_usd: "not tracked"
        hardware: "cloud machines, 4 cores, 15 GB of memory"
      prompting_notes: >-
        The sessions were given written rules for what counts as a result (an exact
        statement, a machine-checked proof, an independent review) and were left to
        choose targets and methods.
  spend_usd: "not tracked"
  notes: >-
    The proof was generated by Claude Fable 5.2, an AI model made by Anthropic. The
    author did not find or write it. The author set up the project and its rules,
    read the reports and decided what to publish. The README of
    marcosmartinsalvador/conjecture-proofs says which proofs the author has studied
    closely; this one is not among them yet.

fidelity:
  divergences: >-
    None known for the 2026 paper's wording. Reading choices: the paper's natural
    numbers start at 1, so the exponents satisfy x, y >= 1; the differences |a - b|
    are taken in the integers; the two summands in D+_n may be equal, as the paper's
    own examples 24 and 40 need. The 2025 thesis words the conjecture with
    x, y >= 0; the extra cases (n = 1 and prime powers) are not formalized here. The
    paper proves that those numbers never have the Δ property.

review:
  status: "agent-reviewed"
  reviewers:
    - "A separate AI agent session (Claude Code) that did not write the proof"
  notes: >-
    No mathematician has reviewed this result. The reviewing session compared each
    Lean definition with the TeX source of arXiv:2605.25264v1, checked in Lean that
    the definitions give the paper's own examples (24 and 40 are Δ-primitive, 96 is
    not, 6 and 10 lack the property), ran its own program on every n up to 300000
    and on every p^x q^y with x, y >= 2 up to 10^12, and searched for earlier work.

alignment:
  namespace: ""
  statements:
    - source: "arXiv:2605.25264v1, conjecture at the end of the subsection \"Integers of the form p^k q\""
      lean: "result"
      module: "Challenge"
      status: "proved"
      note: >-
        `Dstar`, `Dplus`, `HasDelta` and `DeltaPrimitive` are the paper's D*_n, D+_n,
        the Δ property and Δ-primitivity.

acknowledgements: "Mathlib."
