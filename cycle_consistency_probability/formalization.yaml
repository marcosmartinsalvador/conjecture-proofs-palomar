# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
# formalization.yaml v0.4 for the Palomar package in this folder.
version: "v0.4"

project:
  name: "The consistency probability of random 2-sparse equations over F2 on a cycle"
  description: >-
    An exact formula for a probability studied by P. Horak and I. Semaev. Put on
    each edge of the cycle C_n one equation f(x, y) = 0 in the variables at its two
    ends, where f is one of the 16 functions of two variables over the field with two
    elements, chosen uniformly and independently. Let q(C_n) be the probability that
    the system has a solution. The theorem: for every n >= 3,
    q(C_n) = s^n + t^n - 1/4^n - 1/(2 * 8^n) with s, t = (17 ± sqrt 97)/32. The
    formula conjectured in the source has last term 1/8^(n-1), which is 16 times too
    large; the theorem also states that the printed formula is not equal to q(C_n)
    for any n >= 3.
  authors:
    - "Marcos Martín Salvador"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Marcos Martín Salvador"

repository:
  role: "thin-wrapper"
  substantive_formalization:
    id: "https://github.com/marcosmartinsalvador/conjecture-proofs"
    revision: "a051c72158ef471e5541f0ddad2435755fbb070c"

classification:
  arxiv: ["math.CO", "math.PR"]
  msc2020: ["05A15", "60C05"]

sources:
  - title: >-
      The exact consistency probability of the cycle, and a disproof of the formula
      printed in the source
    type: original-proof
    relationship: other
    note: >-
      As far as the searches described in the README of this folder could tell, this
      result was first presented by the author, in the repository
      marcosmartinsalvador/conjecture-proofs (folder
      conjectures/cycle_consistency_probability). The corrected formula is a statement
      made here. It is not known which formula the authors of the paper below meant.
  - title: "Inconsistency Probability of Sparse Equations over F2"
    authors:
      - "P. Horak"
      - "I. Semaev"
    id: "arXiv:2603.24890v1"
    type: paper
    location: "The conjecture of the last subsection"
    relationship: other
    note: >-
      Defines q(G) and conjectures a formula for q(C_n). The formula as printed is
      disproved here and a corrected one is proved. The paper says its computed
      values for n = 3, ..., 7 agree with the printed formula; direct counts for
      those n agree with the corrected formula and not with the printed one, so the
      last term is most likely a misprint. That is a guess.
    author_endorsement: "not-contacted"

related_formalizations: []

status:
  scope: >-
    One theorem, `result : Claim`, for every n >= 3: the exact value of q(C_n), and
    that the formula printed in the source differs from it. The proof is complete: no
    sorry, no axioms beyond the three standard ones, no native_decide. Graphs other
    than cycles are not treated.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: ["propext", "Classical.choice", "Quot.sound"]
  main_results:
    - declaration: "result"
      file: "Solution.lean"
      sorry_count: 0
      axioms: ["propext", "Classical.choice", "Quot.sound"]
      comparator_config: "comparator.json"

automation:
  methods:
    - method: "autonomous"
      models: ["Claude Fable 5.2"]
      framework: "Claude Code"
      tool_setup: >-
        AI agent sessions in Claude Code with Lean 4.36.0 and Mathlib v4.36.0. One
        session found that the printed formula fails, found the corrected formula,
        and wrote the Lean statement and proof. A separate session, which did not
        write the proof, compared the statement with the source and searched for
        earlier solutions. A fixed checker script, which the sessions could not
        change, decided whether the proof was accepted.
      cost:
        wall_time: "not tracked for this result; found and checked on 26 November 2026"
        spend_usd: "not tracked"
        hardware: "cloud machines, 4 cores, 15 GB of memory"
      prompting_notes: >-
        The sessions were given written rules for what counts as a result (an exact
        statement, a machine-checked proof, an independent review) and were left to
        choose targets and methods.
  spend_usd: "not tracked"
  notes: >-
    The proof was generated by Claude Fable 5.2, an AI model made by Anthropic. The
    author did not find or write it. The author set up the project and its rules,
    read the reports and decided what to publish. The README of
    marcosmartinsalvador/conjecture-proofs says which proofs the author has studied
    closely; this is one of them.

fidelity:
  divergences: >-
    The first half of the theorem (the corrected formula) is not the source's
    conjecture; it replaces the last term 1/8^(n-1) by 1/(2 * 8^n). The second half
    states that the source's formula, term for term, is false for every n >= 3.
    Reading choices: the vertices of C_n are Z/n and edge i joins i and i + 1, which
    is the simple cycle for n >= 3; each edge carries an arbitrary function
    F2 x F2 -> F2 (the 16 polynomial functions of the paper); q(C_n) is the number of
    consistent systems divided by 16^n; the powers have natural-number exponents and
    8^(n-1) uses natural subtraction, which is exact because n >= 3.

review:
  status: "agent-reviewed"
  reviewers:
    - "A separate AI agent session (Claude Code) that did not write the proof"
  notes: >-
    No mathematician has reviewed this result. The reviewing session read the
    definitions in the TeX source of arXiv:2603.24890v1, counted the consistent
    systems directly with its own program for n = 3, ..., 7 (2397 of 4096 for the
    triangle; the printed formula gives 2337), checked that the same model reproduces
    the paper's proved formula for paths, and searched for earlier work.

alignment:
  namespace: ""
  statements:
    - source: "arXiv:2603.24890v1, the conjecture of the last subsection"
      lean: "result"
      module: "Challenge"
      status: "disproved as printed; a corrected formula is proved"
      note: >-
        `qCycle n` is the paper's q(C_n). The second formula in `Claim` is the
        paper's; the first is the corrected one.

acknowledgements: "Mathlib."
